# High-Concurrency Nginx Reverse Proxy Configuration for CampEX 2.0
upstream campex_compute_cluster {
    least_conn;
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;
    server_name wallet.campex.edu;

    # High Concurrency Memory Buffers
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;

    # Gzip Compression for Fast Assets
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location / {
        proxy_pass http://campex_compute_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Connection timeouts to prevent socket exhaustion under spikes
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    # Static Assets Caching
    location /assets/ {
        proxy_pass http://campex_compute_cluster;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Health Check Probe
    location /api/health {
        proxy_pass http://campex_compute_cluster/api/health;
        access_log off;
    }
}
