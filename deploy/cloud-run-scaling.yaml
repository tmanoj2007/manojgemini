apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: campex-wallet-backend
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "2"
        autoscaling.knative.dev/maxScale: "100"
        autoscaling.knative.dev/target: "80"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 250
      timeoutSeconds: 300
      serviceAccountName: campex-wallet-sa@project.iam.gserviceaccount.com
      containers:
      - image: gcr.io/campex-2-0/app:latest
        ports:
        - name: http1
          containerPort: 3000
        resources:
          limits:
            cpu: "2000m"
            memory: "2Gi"
        startupProbe:
          httpGet:
            path: /api/health/readiness
            port: 3000
          initialDelaySeconds: 2
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/health/liveness
            port: 3000
          periodSeconds: 10
        env:
        - name: NODE_ENV
          value: "production"
        - name: MAX_CONCURRENT_COMPUTE
          value: "50"
